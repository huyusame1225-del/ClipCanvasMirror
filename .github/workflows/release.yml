name: Build release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish single-file app
        run: dotnet publish ClipCanvasMirror.csproj -c Release -r win-x64 --self-contained true -o release/app

      - name: Create distribution ZIP
        shell: pwsh
        run: |
          Copy-Item README.md release/app/README.md
          Copy-Item LICENSE release/app/LICENSE
          $version = "${{ github.ref_name }}"
          if (-not $version.StartsWith("v")) { $version = "dev" }
          Compress-Archive -Path release/app/* -DestinationPath "release/ClipCanvasMirror-$version-win-x64.zip"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClipCanvasMirror-win-x64
          path: release/ClipCanvasMirror-*-win-x64.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: release/ClipCanvasMirror-*-win-x64.zip

